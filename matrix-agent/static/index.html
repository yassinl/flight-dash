<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Dashboard -- WiFi Setup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d0d0d; color: #e0e0e0;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 1.5rem;
    }
    .card {
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 14px; padding: 2rem; width: 100%; max-width: 420px;
    }
    h1 { color: #ffd700; font-size: 1.5rem; margin-bottom: 0.25rem; }
    .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 1.75rem; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.3rem 0.75rem; border-radius: 999px;
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em; margin-bottom: 1.5rem;
    }
    .badge.connected    { background: #1b3a1b; color: #4caf50; }
    .badge.disconnected { background: #3a1b1b; color: #f44336; }
    .badge.hotspot      { background: #3a2e1b; color: #ff9800; }
    .badge-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .section-label {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em;
      color: #555; text-transform: uppercase; margin-bottom: 0.6rem;
    }
    .network-list {
      display: flex; flex-direction: column; gap: 0.4rem;
      margin-bottom: 1.25rem; max-height: 220px; overflow-y: auto;
    }
    .network-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.65rem 0.9rem; background: #111; border: 1px solid #222;
      border-radius: 8px; cursor: pointer; transition: border-color 0.15s; user-select: none;
    }
    .network-item:hover    { border-color: #444; }
    .network-item.selected { border-color: #ffd700; background: #1a1800; }
    .network-ssid   { font-size: 0.9rem; }
    .network-meta   { display: flex; align-items: center; gap: 0.5rem; }
    .network-signal { font-size: 0.75rem; color: #666; }
    .lock-icon      { font-size: 0.75rem; color: #555; }
    input[type="password"], input[type="text"] {
      width: 100%; background: #111; border: 1px solid #333;
      border-radius: 8px; color: #e0e0e0; font-size: 0.9rem;
      padding: 0.65rem 0.9rem; outline: none; transition: border-color 0.15s;
    }
    input:focus { border-color: #ffd700; }
    .input-wrap { position: relative; margin-bottom: 1rem; }
    .show-pw {
      position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: #555; cursor: pointer; font-size: 0.8rem; padding: 0;
    }
    .show-pw:hover { color: #aaa; }
    .btn {
      width: 100%; padding: 0.7rem 1rem; border-radius: 8px; border: none;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-primary  { background: #ffd700; color: #0d0d0d; }
    .btn-primary:hover:not(:disabled) { background: #ffe033; }
    .btn-secondary {
      background: transparent; border: 1px solid #333; color: #aaa; margin-top: 0.5rem;
    }
    .btn-secondary:hover:not(:disabled) { border-color: #555; color: #ddd; }
    .feedback {
      margin-top: 1rem; padding: 0.6rem 0.9rem;
      border-radius: 8px; font-size: 0.85rem; display: none;
    }
    .feedback.show    { display: block; }
    .feedback.success { background: #1b3a1b; color: #4caf50; }
    .feedback.error   { background: #3a1b1b; color: #f44336; }
    .feedback.info    { background: #1a1a2e; color: #90caf9; }
    .divider { border: none; border-top: 1px solid #222; margin: 1.25rem 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid transparent; border-top-color: currentColor;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 0.4rem;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>Flight Dashboard</h1>
  <p class="subtitle">LED matrix display &#8212; WiFi configuration</p>
  <div id="status-badge" class="badge disconnected">
    <span class="badge-dot"></span>
    <span id="status-text">Checking...</span>
  </div>
  <p class="section-label">WiFi Network</p>
  <div class="network-list" id="network-list">
    <div style="color:#555;font-size:0.85rem;text-align:center;padding:1rem">
      <span class="spinner"></span> Scanning...
    </div>
  </div>
  <button class="btn btn-secondary" id="scan-btn" onclick="scanNetworks()">Rescan</button>
  <hr class="divider" />
  <p class="section-label">Password</p>
  <div class="input-wrap">
    <input type="password" id="pw-input" placeholder="Network password" autocomplete="new-password" />
    <button class="show-pw" id="show-pw-btn" onclick="togglePw()">show</button>
  </div>
  <button class="btn btn-primary" id="connect-btn" onclick="connectWifi()" disabled>Connect</button>
  <div class="feedback" id="feedback"></div>
</div>
<script>
var selectedSSID = null;
function refreshStatus() {
  fetch("/api/status").then(function(r) { return r.json(); }).then(function(d) {
    var el = document.getElementById("status-badge");
    var tx = document.getElementById("status-text");
    if (d.connected) {
      el.className = "badge connected";
      tx.textContent = "Connected \u2014 " + d.ssid;
    } else if (d.hotspot) {
      el.className = "badge hotspot";
      tx.textContent = "Hotspot mode \u2014 connect to configure";
    } else {
      el.className = "badge disconnected";
      tx.textContent = "Not connected";
    }
  }).catch(function() {});
}
function scanNetworks() {
  var list = document.getElementById("network-list");
  list.innerHTML = "<div style=\"color:#555;font-size:0.85rem;text-align:center;padding:1rem\"><span class=\"spinner\"></span> Scanning...</div>";
  document.getElementById("scan-btn").disabled = true;
  fetch("/api/networks").then(function(r) { return r.json(); }).then(renderNetworks)
    .catch(function() {
      list.innerHTML = "<div style=\"color:#f44336;font-size:0.85rem;text-align:center;padding:1rem\">Scan failed</div>";
    }).finally(function() { document.getElementById("scan-btn").disabled = false; });
}
function signalBars(s) {
  if (s >= 75) return "||||"; if (s >= 50) return "|||_";
  if (s >= 25) return "||__"; return "|___";
}
function escHTML(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function renderNetworks(networks) {
  var list = document.getElementById("network-list");
  if (!networks.length) {
    list.innerHTML = "<div style=\"color:#555;font-size:0.85rem;text-align:center;padding:1rem\">No networks found</div>";
    return;
  }
  list.innerHTML = "";
  networks.forEach(function(n) {
    var item = document.createElement("div");
    item.className = "network-item";
    item.dataset.ssid = n.ssid;
    var locked = (n.security && n.security !== "--") ? " \uD83D\uDD12" : "";
    item.innerHTML = "<span class=\"network-ssid\">" + escHTML(n.ssid) + "</span>" +
      "<span class=\"network-meta\">" +
      "<span class=\"lock-icon\">" + locked + "</span>" +
      "<span class=\"network-signal\">" + signalBars(n.signal) + " " + n.signal + "%</span></span>";
    item.addEventListener("click", function() { selectNetwork(n.ssid); });
    list.appendChild(item);
  });
}
function selectNetwork(ssid) {
  selectedSSID = ssid;
  document.querySelectorAll(".network-item").forEach(function(el) {
    el.classList.toggle("selected", el.dataset.ssid === ssid);
  });
  document.getElementById("connect-btn").disabled = false;
  document.getElementById("pw-input").focus();
}
function connectWifi() {
  if (!selectedSSID) return;
  var pw  = document.getElementById("pw-input").value;
  var btn = document.getElementById("connect-btn");
  btn.disabled = true;
  btn.innerHTML = "<span class=\"spinner\"></span> Connecting...";
  showFeedback("info", "Connecting to " + selectedSSID + "...");
  fetch("/api/connect", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ssid: selectedSSID, password: pw })
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.ok) {
      showFeedback("success", "\u2713 Connected! The display is now on your network.");
      refreshStatus();
    } else {
      showFeedback("error", "\u2717 " + (d.message || "Connection failed"));
    }
  }).catch(function() {
    showFeedback("error", "Request failed \u2014 are you still connected to the Pi?");
  }).finally(function() { btn.disabled = false; btn.textContent = "Connect"; });
}
function showFeedback(type, msg) {
  var el = document.getElementById("feedback");
  el.className = "feedback show " + type;
  el.textContent = msg;
}
function togglePw() {
  var inp = document.getElementById("pw-input");
  var btn = document.getElementById("show-pw-btn");
  if (inp.type === "password") { inp.type = "text"; btn.textContent = "hide"; }
  else { inp.type = "password"; btn.textContent = "show"; }
}
document.getElementById("pw-input").addEventListener("keydown", function(e) {
  if (e.key === "Enter") connectWifi();
});
refreshStatus();
scanNetworks();
setInterval(refreshStatus, 10000);
</script>
</body>
</html>
